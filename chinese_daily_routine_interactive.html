<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>中文 · Интерактивные упражнения</title><style>body{font-family:Arial,sans-serif;background:#eaf7ff;color:#17458f;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;background:white;border:3px solid #a7dcff;border-radius:24px;padding:24px;box-shadow:0 12px 30px rgba(34,91,146,.12);text-align:center}.p{font-size:52px}.small{color:#5b7890;font-size:14px;margin-top:8px}</style></head><body><div class="box"><div class="p">🐼</div><b>Загружаю упражнения…</b><div class="small">Обновлённая версия</div></div><script>(async()=>{const base='chinese_daily_routine_v4_parts/';const files=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt'];const pieces=[];for(const f of files){const r=await fetch(base+f+'?v=4',{cache:'no-store'});if(!r.ok)throw new Error(f+' · HTTP '+r.status);pieces.push(await r.text())}const html=pieces.join('');if(!html.includes('renderSentences();')||!html.includes('renderMissing();')||!html.includes('initSearch(1,ws1)'))throw new Error('Файл собран не полностью');document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div class="box"><div class="p">🐼</div><b>Не удалось загрузить упражнение.</b><p>'+String(e.message||e)+'</p><p class="small">Попробуйте обновить страницу через Ctrl+F5.</p></div>'})</script></body></html>
