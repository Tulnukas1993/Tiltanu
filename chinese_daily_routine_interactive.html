<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文 · Интерактивные упражнения</title><style>body{font-family:Arial,sans-serif;background:#eaf7ff;color:#17458f;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;border:3px solid #a7dcff;border-radius:24px;padding:24px;box-shadow:0 12px 30px rgba(34,91,146,.12);text-align:center}.p{font-size:52px}</style></head><body><div class="box"><div class="p">🐼</div><b>Загружаю упражнения…</b></div><script>(async()=>{const files=['chinese_daily_routine_parts/part01.txt','chinese_daily_routine_parts/part02.txt','chinese_daily_routine_parts/part03.txt','chinese_daily_routine_parts/part04.txt','chinese_daily_routine_parts/part05.txt','chinese_daily_routine_parts/part06.txt','chinese_daily_routine_parts/part07.txt'];const pieces=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));document.open();document.write(pieces.join(''));document.close()})().catch(e=>{document.body.innerHTML='<div class="box"><div class="p">🐼</div><b>Не удалось загрузить упражнение.</b><p>'+e.message+'</p></div>'})</script></body></html>
