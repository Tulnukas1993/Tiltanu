  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */

      nextState == null ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    };

      }),

  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {

            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {

              const id = data.id;
              if (typeof id !== &quot;number&quot;) {

                pendingStateWrites.delete(id);

      }

    },
    { capture: true },
  );

    }

        id = decodeURIComponent(href.slice(1));

const passages=[
 &#x27;Menna was born with less than 5% vision, but her parents didn’t want her to feel different to other children. She did the same sports as her older sisters and started skiing when she was only five years old. She followed her father down the slopes. Sometimes he forgot Menna was behind him and he took her down difficult slopes and even off-piste*! She was clearly a ‘natural’. In 2010 a ski coach noticed her and she started training with the British Parasnowsport team.&#x27;,
 &#x27;Skiing at 110 kph is not easy even when you can see clearly – but imagine skiing with less than 5% vision. Menna says that it’s like skiing in thick fog. Your eyes can’t see, so your ears are everything – you need to hear what your guide is saying. During competitions, the crowds can’t make any noise – they stay completely silent.&#x27;,
 &#x27;Jen is an Army Officer in the Royal Engineers. She loved skiing and raced with the Army Ski Team. In 2013, a coach asked her to become a guide for the British Parasnowsport team. She agreed and two years later she was paired with Menna. The two girls immediately became best friends. It was not just the beginning of a friendship, but also a great sporting partnership. They say that they are like sisters who don’t fight.&#x27;,
 &#x27;In March 2018, at the Winter Paralympic Games in South Korea, the girls crashed out in their opening race. But they didn’t give up. They continued to fight and went on to win a bronze and two silver medals. That was good, but then on the final day Menna and Jen won a gold medal – the UK’s only gold of the Games! Jen proudly said, ‘we fought right to the very end’.&#x27;,
 &#x27;Menna and Jen are going to continue skiing together in the future and hope for more success. However, when their skiing partnership does finally end, the girls know that they are going to be friends forever.&#x27;
];

        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
