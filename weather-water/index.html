const tea=['beverage','blow','dunk','saucer','sip','spoon','stir'];data.push({title:'Tea etiquette',instruction:'Complete the text with the words a–g.',bank:tea,passage:true,qs:[q('There is an art to having a {0} in one traditional English tearoom in Brighton. You don’t put your elbows on the table. You don’t make a noise with your {1} on the inside of your cup as you {2} your tea. You don’t insult the Queen, {3} from your teaspoon or handle the sugar cubes. And if you use a mobile phone or {4} your biscuit in your tea, you will be invited to leave. There are other rules, too: the cup should be placed back on the {5} between sips and not waved in the air, and you should not {6} on your tea to cool it.','beverage',tea,'beverage = напиток.'),q('','spoon',tea,'spoon = ложка.'),q('','stir',tea,'stir your tea = размешивать чай.'),q('','sip',tea,'sip = пить маленькими глотками.'),q('','dunk',tea,'dunk = обмакивать.'),q('','saucer',tea,'saucer = блюдце.'),q('','blow',tea,'blow on = дуть на что-либо.')]});

function current(){return state[idx]||(state[idx]={a:{},checked:false,show:false})}function control(n){let s=current(),v=s.a[n]||'',q=data[idx].qs[n];return `<select aria-label="Answer ${n+1}" data-n="${n}"><option value="">${n+1} · Choose…</option>${q.opts.map(o=>`<option ${o===v?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`}function fill(t){return t.replace(/\{(\d+)\}/g,(_,n)=>control(+n))}
function render(){let d=data[idx],s=current();document.getElementById('nav').innerHTML=chapters.map((c,i)=>`<button class="${i===idx?'active':''}" onclick="go(${i})">${i+1}. ${c}</button>`).join('');let html=`<div class="badge">EXERCISE ${idx+1} / 10</div><h2>${d.title}</h2><p>${d.instruction}</p>${d.note?`<p class="muted">${d.note}</p>`:''}`;if(d.bank)html+=`<div class="bank">${d.bank.map((w,i)=>String.fromCharCode(97+i)+'. '+w).join(' · ')}</div>`;if(d.definitions)html+=`<details open><summary>Definitions / endings</summary>${d.definitions.map((t,i)=>`<div><b>${String.fromCharCode(97+i)}.</b> ${t}</div>`).join('')}</details>`;

function evaluate(show=false){let d=data[idx],s=current(),score=0,total=d.qs.length,feedback=[];if(d.kind==='words'){let tokens=recipe.split(/(\s+)/),found=new Set(),wrong=0;document.querySelectorAll('[data-w]').forEach(el=>{let n=el.dataset.w,w=tokens[n].toLowerCase().replace(/[^a-z]/g,''),ok=liquidWords.includes(w);el.classList.remove('correct','wrong');if(s.a[n]){if(ok)found.add(w);else wrong++;el.classList.add(ok?'correct':'wrong')}if(show&&ok)el.classList.add('correct')});score=Math.min(10,found.size);total=10;feedback.push(`Найдено разных подходящих слов: ${found.size}/10. Лишних выделений: ${wrong}.`);if(show)feedback.push('Подходящие слова: '+liquidWords.join(', '));s.passed=score===10&&wrong===0;}else{let seen=new Set();d.qs.forEach((q,n)=>{let v=(s.a[n]||'').trim(),ok,why=q.why;if(d.kind==='sports'){let norm=v.toLowerCase().replace(/\s+/g,' '),key=sports[norm];ok=!!key&&!seen.has(key);why=ok?'Подходит.':!v?'Введите название спорта.':key?'Этот вид спорта уже указан.':'Название не распознано. Проверьте написание или обсудите ответ с преподавателем.';if(key)seen.add(key)}else ok=q.ans.includes(v);if(ok)score++;let el=document.querySelector(`[data-n="${n}"]`);if(el){el.classList.remove('correct','wrong');el.classList.add(ok?'correct':'wrong')}feedback.push(`<div class="feedback ${ok?'good':'bad'}">${ok?'✓':'○'} ${n+1}. ${ok?'Верно.':v?'Попробуйте ещё раз.':'Нет ответа.'} ${show&&d.kind!=='sports'?'<b>Ответ: '+q.ans.join(' / ')+'</b>. ':''}${why}</div>`)});s.passed=score===total;if(show&&d.kind==='sports')feedback.push('Пример: swimming, diving, water polo, surfing, rowing, sailing, figure skating, ice hockey, skiing, snowboarding.');}document.getElementById('result').innerHTML=`<h3>${s.passed?'Отлично!':'Результат'} ${score} / ${total}</h3>${feedback.join('')}`;s.score=score;s.total=total;save()}
function check(){current().checked=true;evaluate(false);updateProgress()}function reveal(){current().show=true;evaluate(true);updateProgress()}function resetSection(){state[idx]={a:{},checked:false,show:false};save();render()}function go(i){idx=i;render();window.scrollTo({top:0,behavior:'smooth'})}function updateProgress(){let done=Object.values(state).filter(s=>s.checked&&s.passed).length;document.getElementById('summary').textContent=`Упражнений выполнено: ${done} из 10 · Ответы скрыты до проверки`;document.getElementById('progress').value=done*10}render();
