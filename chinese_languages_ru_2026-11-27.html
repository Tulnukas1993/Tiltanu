const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)], shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}, esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), norm=s=>s.replace(/[\s，。！？、；：,.!?;:]/g,"");

function drawOrder(i){let a=$('.order-answer[data-row="'+i+'"]',body(7)),b=$('.order-bank[data-row="'+i+'"]',body(7)),mk=t=>`<button class="word cn" draggable="true" data-row="${i}" data-word="${t.id}">${esc(t.s)}</button>`;a.innerHTML=orders[i].map(id=>mk(pools[i].find(t=>t.id===id))).join("");b.innerHTML=pools[i].filter(t=>!orders[i].includes(t.id)).map(mk).join("");a.classList.remove("correct","wrong")}
function moveWord(i,id,to,before){let l=orders[i];if(to&&id===before)return;let old=l.indexOf(id);if(old>=0)l.splice(old,1);if(to){let index=before?l.indexOf(before):-1;if(index>=0)l.splice(index,0,id);else l.push(id)}drawOrder(i);dirty(7)}
body(7).addEventListener("click",e=>{if(Date.now()<(window.suppressClickUntil||0))return;let w=e.target.closest("[data-word]"),c=e.target.closest("[data-clear-order]");if(w)moveWord(+w.dataset.row,w.dataset.word,!!w.closest(".order-bank"));else if(c){let i=+c.dataset.clearOrder;orders[i]=[];drawOrder(i);dirty(7)}});
handlers[7]={check(){let c=0;items7.forEach((x,i)=>{let sentence=orders[i].map(id=>pools[i].find(t=>t.id===id).s).join("");let ok=orders[i].length===x.tokens.length&&x.valid.some(v=>norm(v)===norm(sentence));setMark($('.order-answer[data-row="'+i+'"]',body(7)),ok);c+=ok});report(7,c,items7.length)},reset:renderOrders};renderOrders();
