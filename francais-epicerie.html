const sections=[{"title": "Name the food", "subtitle": "Look at each picture. Type the French noun only, without an article.", "rule": "Learn nouns with their articles: une pomme, un citron. In this exercise, type only the noun.", "questions": [{"text": "What is this?", "answer": "carotte", "hint": "Look at the shape and colour of the food.", "img": "carotte"}, {"text": "What is this?", "answer": "aubergine", "hint": "Look at the shape and colour of the food.", "img": "aubergine"}, {"text": "What is this?", "answer": "poire", "hint": "Look at the shape and colour of the food.", "img": "poire"}, {"text": "What is this?", "answer": "fromage", "hint": "Look at the shape and colour of the food.", "img": "fromage"}, {"text": "What is this?", "answer": "pain", "hint": "Look at the shape and colour of the food.", "img": "pain"}, {"text": "What is this?", "answer": "fraise", "hint": "Look at the shape and colour of the food.", "img": "fraise"}, {"text": "What is this?", "answer": "oignon", "hint": "Look at the shape and colour of the food.", "img": "oignon"}, {"text": "What is this?", "answer": "beurre", "hint": "Look at the shape and colour of the food.", "img": "beurre"}]}, {"title": "Sort your groceries", "subtitle": "Type the food group in French: fruits, légumes or produits laitiers.", "rule": "Les fruits = fruit; les légumes = vegetables; les produits laitiers = dairy products.", "questions": [{"text": "le lait", "answer": "produits laitiers", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["produits laitiers", "les produits laitiers"]}, {"text": "la banane", "answer": "fruits", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["fruits", "les fruits"]}, {"text": "la courgette", "answer": "légumes", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["légumes", "les légumes"]}, {"text": "le yogourt", "answer": "produits laitiers", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["produits laitiers", "les produits laitiers"]}, {"text": "le citron", "answer": "fruits", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["fruits", "les fruits"]}, {"text": "la pomme de terre", "answer": "légumes", "hint": "Think about what the food is made from or where it grows.", "img": null, "accept": ["légumes", "les légumes"]}]}, {"title": "Containers & quantities", "subtitle": "Complete each gap in French. Write numbers as French words.", "rule": "After a quantity or container, use de / d’ + food. Examples: un kilo de riz; un litre d’eau. Before a vowel, de becomes d’.", "questions": [{"text": "A bottle of oil: une ___ d’huile", "answer": "bouteille", "hint": "This container holds a liquid.", "img": null}, {"text": "A slice of bread: une ___ de pain", "answer": "tranche", "hint": "Use the word for a thin piece cut from a loaf.", "img": null}, {"text": "A pinch of salt: une ___ de sel", "answer": "pincée", "hint": "You can hold this tiny amount between two fingers.", "img": null}, {"text": "1 kg = ___ grammes", "answer": "mille", "hint": "One kilogram is ten lots of one hundred grams. Write the number in French.", "img": null}, {"text": "Une bouteille ___ eau", "answer": "d’", "hint": "Use the shortened form before a vowel.", "img": null}, {"text": "Deux kilos ___ pommes", "answer": "de", "hint": "After a precise quantity, use the preposition for “of”.", "img": null}]}, {"title": "Grammar in context", "subtitle": "Type the missing article or de / d’. Use general preferences or unspecified quantities, as appropriate.", "rule": "General preference: J’aime le riz. Unspecified quantity: Je mange du riz. Negative: Je ne mange pas de riz. Before a vowel: de l’eau → pas d’eau.", "questions": [{"text": "J’aime ___ fromage.", "answer": "le", "hint": "Use a definite article for a general preference after aimer.", "img": null}, {"text": "Je mange ___ fromage.", "answer": "du", "hint": "Fromage is masculine; the amount is unspecified.", "img": null}, {"text": "Je ne mange pas ___ fromage.", "answer": "de", "hint": "After a negative, the partitive article usually changes.", "img": null}, {"text": "Elle achète ___ tomates.", "answer": "des", "hint": "Tomates is plural; the quantity is unspecified.", "img": null}, {"text": "Nous buvons ___ eau.", "answer": "de l’", "hint": "Eau starts with a vowel; the amount is unspecified.", "img": null}, {"text": "Tu aimes ___ fraises ?", "answer": "les", "hint": "A general preference, with a plural noun.", "img": null}, {"text": "Il faut ___ huile.", "answer": "de l’", "hint": "Use the partitive form before a vowel.", "img": null}, {"text": "Nous n’avons pas ___ œufs.", "answer": "d’", "hint": "After a negative, use the shortened form before a vowel.", "img": null}]}, {"title": "Fill your basket", "subtitle": "Calculate what is missing for the soup. Type the missing quantities in French words.", "rule": "Il faut acheter… = We need to buy… Example: you need 400 g and have 100 g → Il faut acheter trois cents grammes.", "recipe": true, "questions": [{"text": "Il faut acheter ___ de pommes de terre.", "answer": "trois cents grammes", "hint": "Subtract the amount at home from the amount in the recipe.", "img": "pomme_terre"}, {"text": "Il faut acheter ___ carottes.", "answer": "deux", "hint": "How many more carrots do you need to have three?", "img": "carotte"}, {"text": "Il faut acheter ___ oignons.", "answer": "deux", "hint": "There are no onions at home.", "img": "oignon"}]}, {"title": "À l’épicerie · Canada", "subtitle": "Complete the shopping phrases in French.", "rule": "In Quebec, faire l’épicerie means to shop for groceries. Yogourt is a Canadian French variant of yaourt. The same grammar rules apply.", "questions": [{"text": "To shop for groceries (Quebec): faire ___", "answer": "l’épicerie", "hint": "Use the Quebec expression for grocery shopping.", "img": null}, {"tex let activeInput=null;
function feedback(si,qi){const q=sections[si].questions[qi],k=id(si,qi),input=document.getElementById('q'+qi),card=input.closest('.card'),f=card.querySelector('.feedback');card.classList.remove('correct','incorrect');f.textContent='';input.removeAttribute('aria-invalid');if(!state.checked[k])return;let v=state.answers[k]||'',ok=correct(q,v);card.classList.add(ok?'correct':'incorrect');input.setAttribute('aria-invalid',String(!ok));f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Correct!':!v.trim()?'Type your answer first.':almost(q,v)?'Almost! Check the French accents.':'Try again. '+q.hint;}
function render(){activeInput=null;const si=state.index,s=sections[si];document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${i===si?'active':''}" aria-current="${i===si?'step':'false'}" data-step="${i}">${i+1}. ${x.title}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.index=+b.dataset.step;save();render()});const el=document.getElementById('lesson');el.innerHTML=`<h2>${s.title}</h2><p class="intro">${s.subtitle}</p><details><summary>Review the rule</summary><p>${s.rule}</p></details><p class="keyboard-note">Need an accent? Click an answer box, then a letter below. Press Enter to check the section.</p><div class="accents" aria-label="French characters">${['é','è','ê','ë','à','â','î','ï','ô','ù','û','ç','œ','’'].map(c=>`<button type="button" data-char="${c}" aria-label="Insert ${c}">${c}</button>`).join('')}</div>${s.recipe?'<div class="recipe"><table><tr><th>Food</th><th>Recipe</th><th>At home</th></tr><tr><td>Pommes de terre</td><td>500 g</td><td>200 g</td></tr><tr><td>Carottes</td><td>3</td><td>1</td></tr><tr><td>Oignons</td><td>2</td><td>0</td></tr></table></div>':''}<div class="grid">${s.questions.map((q,qi)=>`<article class="card"><span class="num">${String(qi+1).padStart(2,'0')}</span>${q.img?`<img src="${images[q.img]}" alt="Food illustration for question ${qi+1}">`:''}<label class="question" for="q${qi}">${q.text}</label><input type="text" id="q${qi}" data-q="${qi}" lang="fr" placeholder="Type in French…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="f${qi}"><p id="f${qi}" class="feedback" aria-live="polite"></p></article>`).join('')}</div><div class="actions"><button class="primary" id="check">Check section</button><button id="next">${si===sections.length-1?'Back to first section':'Next section →'}</button></div><div class="result" id="result" aria-live="polite"></div>`;
el.querySelectorAll('input').forEach(input=>{const qi=+input.dataset.q,k=id(si,qi);input.value=state.answers[k]||'';input.onfocus=()=>activeInput=input;input.oninput=()=>{state.answers[k]=input.value;delete state.checked[k];save();feedback(si,qi);document.getElementById('result').textContent='';stats()};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('check').click()}};feedback(si,qi)});
el.querySelectorAll('[data-char]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if(!activeInput){activeInput=el.querySelector('input')}const input=activeInput;input.focus();input.setRangeText(b.dataset.char,input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input',{bubbles:true}))}});
document.getElementById('check').onclick=()=>{let n=0;s.questions.forEach((q,qi)=>{state.checked[id(si,qi)]=true;feedback(si,qi);if(correct(q,state.answers[id(si,qi)]))n++});save();stats();document.getElementById('result').textContent=n===s.questions.length?'Great work! All answers in this section are correct.':`Correct: ${n} of ${s.questions.length}. Edit the marked answers and check again.`};document.getElementById('next').onclick=()=>{state.index=(si+1)%sections.length;save();render();document.getElementById('nav').scrollIntoView({behavior:'smooth'})};stats();}
document.getElementById('reset').onclick=()=>{if(confirm('Clear your answers and start again?')){state={index:0,answers:{},checked:{}};save();render()}};render();
</script></html>
