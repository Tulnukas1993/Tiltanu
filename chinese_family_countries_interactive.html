const labels=['1. Семья','2. Символы стран','3. Вопросы и ответы','4. Диалог','5. Иероглифы'];
const pairs=[[
['你叫什么名字？','我叫美心，我姓林。'],['你姓什么？','我姓林。'],['你家有几口人？','我家有四口人。'],['你妹几岁？','她两岁。'],['你爸爸多大了？','他今年五十一岁。'],['你家有什么人？','爸爸，妈妈和我。'],['你妈妈有兄弟姐妹吗？','她有一个哥哥。'],['你爸爸有兄弟姐妹吗？','他没有兄弟姐妹。']
],[['symbol0','英国人'],['symbol1','西班牙人'],['symbol2','法国人'],['symbol3','美国人'],['symbol4','日本人'],['symbol5','中国人']],[['你住在中国吗？','我不住在中国，我住在新加坡。'],['他们是哪国人？','他们是英国人。'],['她是美国人吗？','是，她是美国人。'],['他是你的日本朋友吗？','不是，他是我的中国朋友。']]];
const dialogue=['你是哪国人？','我是中国人。你呢？','我也是中国人。','我二〇〇六年出生。你呢？','我也是。我的生日是二月十五日，你呢？','二月十五日？我的生日也是二月十五日！'];
const phrases=[['Франция','法国'],['Я британец / британка.','我是英国人'],['Американец / американцы','美国人'],['Какой он национальности?','他是哪国人'],['Китаец / китайцы','中国人'],['Она британка?','她是英国人吗']];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.length>1&&b.every((x,i)=>x===a[i]))[b[0],b[1]]=[b[1],b[0]];return b}
function initial(){return {tab:0,done:[],maps:[{},{},{}],orders:pairs.map(a=>shuffle(a.map((_,i)=>i))),dialog:shuffle(dialogue.map((_,i)=>i)),chars:phrases.map(p=>({bank:shuffle([...p[1]].map((c,i)=>({c,id:i}))),answer:[]}))}}
let state;try{state=JSON.parse(localStorage.getItem('zhPractice1610v1'))}catch{}if(!state||!state.chars)state=initial();let selected=null,checked=false;
const app=document.getElementById('app');function save(){localStorage.setItem('zhPractice1610v1',JSON.stringify(state))}function done(ok){state.done=state.done.filter(n=>n!==state.tab);if(ok)state.done.push(state.tab);save();meter()}
function meter(){document.getElementById('meter').textContent=`Выполнено: ${state.done.length} из 5 заданий`;document.getElementById('nav').innerHTML=labels.map((l,i)=>`<button class="${state.tab===i?'active':''}" onclick="tab(${i})">${l}${state.done.includes(i)?' ✓':''}</button>`).join('')}
function tab(n){state.tab=n;selected=null;checked=false;save();render()}
function render(){meter();let t=state.tab;if(t<3){const titles=['Соедините вопросы и ответы','Соедините символ страны и надпись','Найдите ответ на каждый вопрос'];app.innerHTML=`<h2>${titles[t]}</h2><p class="sub">Нажмите карточку слева, затем подходящую карточку справа. Чтобы изменить пару, выберите её заново.</p><div class="match"><svg class="lines" aria-hidden="true"></svg><div class="col" id="left"></div><div class="col" id="right"></div></div>`;
let a=pairs[t];document.getElementById('left').innerHTML=a.map((p,i)=>`<button class="item ${state.maps[t][i]!==undefined?'linked':''} ${selected===i?'selected':''}" data-l="${i}" onclick="pickLeft(${i})"><span class="badge">${i+1}</span>${t===1?`<img class="symbol" src="${symbolImages[p[0]]}" alt="Символ страны ${i+1}">`:p[0]}</button>`).join('');document.getElementById('right').innerHTML=state.orders[t].map((id,j)=>`<button class="item ${Object.values(state.maps[t]).includes(id)?'linked':''}" data-r="${id}" onclick="pickRight(${id})"><span class="badge">${String.fromCharCode(65+j)}</span>${a[id][1]}</button>`).join('');requestAnimationFrame(lines)
}else if(t===3){app.innerHTML='<h2>Восстановите порядок диалога</h2><p class="sub">Начните с вопроса о национальности. Перемещайте реплики кнопками ↑ и ↓ или перетаскивайте их.</p>'+state.dialog.map((id,i)=>`<div class="row" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="dropRow(event,${i})"><span class="badge">${i+1}</span><span class="zh">${dialogue[id]}</span><div class="move"><button aria-label="Реплика ${i+1}: вверх" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑</button><button aria-label="Реплика ${i+1}: вниз" onclick="move(${i},1)" ${i===5?'disabled':''}>↓</button></div></div>`).join('')
}else{app.innerHTML='<h2>Расставьте иероглифы</h2><p class="sub">Соберите китайскую фразу по подсказке. Нажимайте иероглифы внизу; нажмите выбранный иероглиф, чтобы вернуть его.</p>'+phrases.map((p,i)=>`<div class="sentence" id="s${i}"><h3>${i+1}. ${p[0]}</h3><div class="answer" aria-label="Ваш ответ">${state.chars[i].answer.map((x,j)=>`<button onclick="charMove(${i},${j},true)">${x.c}</button>`).join('')}</div><div class="bank">${state.chars[i].bank.map((x,j)=>`<button onclick="charMove(${i},${j},false)">${x.c}</button>`).join('')}</div></div>`).join('')}
app.innerHTML+='<div class="actions"><button class="primary" onclick="check()">Проверить</button><button onclick="reset()">Начать заново</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>';app.querySelectorAll('img').forEach(x=>x.onload=lines)}
function pickLeft(i){selected=i;render()}function pickRight(id){if(selected===null){document.getElementById('feedback').textContent='Сначала выберите карточку слева.';return}let m=state.maps[state.tab];for(let k in m)if(m[k]===id)delete m[k];m[selected]=id;selected=null;checked=false;done(false);render()}
function lines(){if(state.tab>2)return;const box=app.querySelector('.match');if(!box)return;const b=box.getBoundingClientRect();const m=state.maps[state.tab];box.querySelector('svg').innerHTML=Object.entries(m).map(([l,r])=>{let x=box.querySelector(`[data-l="${l}"]`).getBoundingClientRect(),y=box.querySelector(`[data-r="${r}"]`).getBoundingClientRect();let color=checked?(+l===r?'#24795c':'#b74352'):'#6b9bb6';return `<line x1="${x.right-b.left}" y1="${x.top+x.height/2-b.top}" x2="${y.left-b.left}" y2="${y.top+y.height/2-b.top}" stroke="${color}" stroke-width="3"/>`}).join('')}
function move(i,d){let j=i+d;if(j<0||j>=6)return;[state.dialog[i],state.dialog[j]]=[state.dialog[j],state.dialog[i]];done(false);render()}
function dropRow(e,j){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(i)||i<0||i>5)return;let [x]=state.dialog.splice(i,1);state.dialog.splice(j,0,x);done(false);render()}
function charMove(i,j,back){let s=state.chars[i],a=back?s.answer:s.bank,b=back?s.bank:s.answer;b.push(a.splice(j,1)[0]);done(false);let scroll=window.scrollY;render();window.scrollTo(0,scroll)}
function check(){let t=state.tab,n=0,total;if(t<3){total=pairs[t].length;checked=true;for(let i=0;i<total;i++){let correct=state.maps[t][i]===i;if(correct)n++;app.querySelector(`[data-l="${i}"]`).classList.add(correct?'good':'bad')}lines()}else if(t===3){total=6;app.querySelectorAll('.row').forEach((el,i)=>{let c=state.dialog[i]===i;if(c)n++;el.classList.remove('good','bad');el.classList.add(c?'good':'bad')})}else{total=6;state.chars.forEach((s,i)=>{let c=s.answer.map(x=>x.c).join('')===phrases[i][1];if(c)n++;let el=document.getElementById('s'+i);el.classList.remove('good','bad');el.classList.add(c?'good':'bad')})}done(n===total);document.getElementById('feedback').textContent=n===total?`✓ Отлично! Всё верно: ${n} из ${total}.`:`Верно: ${n} из ${total}. Исправьте карточки с красной рамкой и проверьте ещё раз.`}
function reset(){let t=state.tab;if(t<3){state.maps[t]={};state.orders[t]=shuffle(pairs[t].map((_,i)=>i))}else if(t===3)state.dialog=shuffle(dialogue.map((_,i)=>i));else state.chars=initial().chars;checked=false;selected=null;done(false);render()}window.addEventListener('resize',lines);render();
</script></body></html>
