</style><header><div class="tag" style="color:#94ded5">GRAMMAR LAB · A1–A2</div><h1>Every day & right now</h1><p>Present Simple · Present Continuous</p><p style="font-size:15px">Complete the exercises. Check your answers when you are ready.</p></header><main id="app"></main><footer>Your answers are saved in this browser automatically.</footer><script>
const app=document.getElementById('app');let n=0;const keys={};
function field(a,wide=false){let id='a'+(++n);keys[id]=Array.isArray(a)?a:[a];return '<span><input aria-label="Answer '+n+'" autocomplete="off" id="'+id+'" class="'+(wide?'wide':'')+'"><small class="feedback" aria-live="polite"></small></span>'}
function section(title,body){let s=document.createElement('section');s.innerHTML='<h2>'+title+'</h2>'+body+'<div><button onclick="check(this)">Check answers</button><button class="secondary" onclick="show(this)">Show answers</button><button class="secondary" onclick="reset(this)">Try again</button><span class="result" aria-live="polite"></span></div>';app.appendChild(s)}
function rows(items){return items.map((s,i)=>'<div class="item">'+(i+1)+'. '+s+'</div>').join('')}
section('1 · Doctor Times Two','<div class="intro"><div><div class="art doctors" role="img" aria-label="Twin doctors: Chris in blue scrubs and Xand in green scrubs"></div><p class="hint">Chris & Xand · Illustration</p></div><div><p>Complete the text with the verb forms in the box.</p><div class="bank">look · wants · do · don’t live · works · lives · does · have · wears (×2)</div></div></div><p>Chris and Xand van Tulleken are identical twins, and they’re both doctors. They also <b>work</b> as TV presenters on science programmes and '+field('do')+' a lot of work for charity.</p><p>Chris and Xand both '+field('have')+' medical degrees from Oxford University, and they trained and qualified as doctors at the same hospital. They '+field('look')+' identical, although Chris is taller than Xand by half an inch, and older, too — by seven minutes!</p><p>As well as presenting TV shows, Chris is studying at University College London, because he '+field('wants')+' to get a PhD. Xand '+field('lives')+' in New York and works at Fordham University. He also '+field('works')+' as an editor for the <i>Oxford Handbook of Humanitarian Medicine</i> and '+field('does')+' a lot of work for the World Health Organization.</p><p>The twins '+field(["don’t live","do not live"])+' in the same country, but they have a common project. They both believe it’s very important to get young people interested in science and medicine, and together they present a popular children’s medical TV show called <i>Operation Ouch!</i>. How can children tell which twin is which on TV? It’s easy! Dr Chris always '+field('wears')+' a blue shirt and Dr Xand '+field('wears')+' a green one!</p><p class="hint">Answer the next three exercises using this textbook text.</p>');
section('2 · Ask about the twins','<p>Complete the questions.</p><div class="example">What <b>do</b> Chris and Xand <b>do</b>? — They’re doctors.</div>'+rows(['How much older than Xand '+field('is')+' Chris?<br><span class="hint">Seven minutes.</span>','Where '+field('do')+' they '+field('live')+'?<br><span class="hint">Chris lives in the UK and Xand lives in New York.</span>','Where '+field('does')+' Xand '+field('work')+'?<br><span class="hint">At Fordham University.</span>','What '+field('do')+' they '+field('believe')+' is important?<br><span class="hint">To get young people interested in science and medicine.</span>','Why '+field('do')+' they '+field('wear')+' different colour shirts on TV?<br><span class="hint">So the children can tell which twin is which.</span>']));
section('3 · Make it negative','<div class="example">Chris <b>doesn’t work</b> (not work) for the Oxford Handbook of Humanitarian Medicine.</div>'+rows(['They '+field(["don’t present","do not present"])+ ' (not present) a children’s talent show.','Chris '+field(["doesn’t live","does not live"])+ ' (not live) in New York.','They '+field(["don’t wear","do not wear"])+ ' (not wear) the same colour clothes on TV.']));
section('4 · Short answers','<div class="example">Do Xand and Chris have medical degrees? — <b>Yes, they do.</b></div>'+rows(['Does Chris have a degree from Fordham University?'+field(["No, he doesn’t.","No, he does not."],true),'Does Xand work for the World Health Organization?'+field('Yes, he does.',true),'Do they live in the same country?'+field(["No, they don’t.","No, they do not."],true)]));
section('5 · Look at the pictures','<p>Answer about their jobs and what they are doing now. Complete the gaps or write a short answer.</p><div class="grid"><div><div class="art coach" role="img" aria-label="Serena, a football coach, talking to children on a football pitch"></div><h3>“I’m Serena. I’m a football coach.”</h3><div class="example">What does Serena do?<br>She’s a football coach.</div>'+rows(['Where does she work?<br>'+field('She works')+' at a football club.','Is she working now?'+field('Yes, she is.',true),'What’s she doing?<br>'+field(["She’s talking","She is talking","She’s speaking","She is speaking"])+' to some children.'])+'</div><div><div class="art cyclist" role="img" aria-label="James, a journalist, riding a bicycle in a park"></div><h3>“I’m James. I’m a journalist.”</h3>'+rows(['What does James do?'+field(["He’s a journalist.","He is a journalist."],true),'What does he write?<br>'+field('He writes')+' articles for a newspaper.','Is he working now?'+field(["No, he isn’t.","No, he is not.","No, he’s not."],true),'What’s he doing?'+field(["He’s riding a bike.","He is riding a bike.","He’s riding a bicycle.","He is riding a bicycle.","He’s cycling.","He is cycling."],true)])+'</div></div>');
const choices=[["I ___ to work now. See you later.",["’m going","go"],"’m going"],["We ___ the news on TV every evening.",["’re watching","watch"],"watch"],["Don’t turn the TV off, I ___ it!",["watch","’m watching"],"’m watching"],["Carla’s Italian. She ___ from Milan.",["’s coming","comes"],"comes"],["___ Spanish food? I love tapas.",["Do you like","Are you liking"],"Do you like"],["I ___ any pets.",["’m not having","don’t have"],"don’t have"],["Don’t wait for Erik. He ___ .",["doesn’t come","isn’t coming"],"isn’t coming"],["What’s the matter? Why ___ crying?",["are you","do you"],"are you"]];
section('6 · Choose the correct form',rows(choices.map(([q,opts,a])=>{let id='a'+(++n);keys[id]=[a];return q.replace('___','<span><select id="'+id+'" aria-label="Choose a verb"><option value="">Choose…</option>'+opts.map(v=>'<option>'+v+'</option>').join('')+'</select><small class="feedback" aria-live="polite"></small></span>')})));
const corrections=[['The sun always is rising in the east.',['The sun always rises in the east.']],['I look for a white shirt in medium. Have you got any?',["I’m looking for a white shirt in medium. Have you got any?","I am looking for a white shirt in medium. Have you got any?","I am looking for a white shirt in medium."]],['“Where’s Dave?” “He’s over there. He talks to Angela.”',["He’s over there. He’s talking to Angela.","He is over there. He is talking to Angela.","He’s talking to Angela.","He is talking to Angela."]],['She’s 21 years old! I’m not believing her!',["She’s 21 years old! I don’t believe her!","She is 21 years old! I do not believe her!","I don’t believe her!","I do not believe her!"]],['I’m learn English for my job.',["I’m learning English for my job.","I am learning English for my job.","I learn English for my job."]],['Why you going out without a coat? It’s freezing!',["Why are you going out without a coat? It’s freezing!","Why are you going out without a coat?"]],['My father work in a bank.',['My father works in a bank.']],['I see my friends later this evening.',["I’m seeing my friends later this evening.","I am seeing my friends later this evening."]],['What is this word mean?',['What does this word mean?']]];
section('7 · Correct the mistakes','<p>Rewrite each sentence correctly. You can write only the sentence that needs correcting.</p><div class="example"><s>I’m liking black coffee.</s> → <b>I like black coffee.</b></div>'+rows(corrections.map(([q,a])=>q+field(a,true))));
function norm(v){return v.toLowerCase().replace(/[’‘]/g,"'").replace(/\b(he|she|it)'s\b/g,'$1 is').replace(/\bi'm\b/g,'i am').replace(/\bdon't\b/g,'do not').replace(/\bdoesn't\b/g,'does not').replace(/\bisn't\b/g,'is not').replace(/\s+/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function check(btn){let s=btn.closest('section'),fields=[...s.querySelectorAll('input,select')],good=0;fields.forEach(e=>{let ok=keys[e.id].some(a=>norm(a)===norm(e.value));e.className=(e.tagName==='INPUT'&&e.classList.contains('wide')?'wide ':'')+(ok?'correct':'incorrect');e.nextElementSibling.textContent=ok?'✓ Correct':e.value.trim()?'Try again.':'Enter an answer.';if(ok)good++});s.querySelector('.result').textContent=good+' / '+fields.length+' correct';save()}
function show(btn){let s=btn.closest('section');s.querySelectorAll('input,select').forEach(e=>e.nextElementSibling.textContent='Answer: '+keys[e.id][0]);s.querySelector('.result').textContent='Model answers shown. Your entries are unchanged.'}
function reset(btn){let s=btn.closest('section');s.querySelectorAll('input,select').forEach(e=>{e.value='';e.classList.remove('correct','incorrect');e.nextElementSibling.textContent=''});s.querySelector('.result').textContent='';save()}
function save(){try{let v={};document.querySelectorAll('input,select').forEach(e=>v[e.id]=e.value);localStorage.setItem('grammar-twins-v1',JSON.stringify(v))}catch{}}
try{let v=JSON.parse(localStorage.getItem('grammar-twins-v1')||'{}');Object.entries(v).forEach(([id,value])=>{if(document.getElementById(id))document.getElementById(id).value=value})}catch{}
document.addEventListener('input',e=>{if(e.target.matches('input,select')){e.target.classList.remove('correct','incorrect');e.target.nextElementSibling.textContent='';e.target.closest('section').querySelector('.result').textContent='';save()}});
</script></html>
