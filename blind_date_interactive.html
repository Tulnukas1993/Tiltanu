:root{--ink:#213c3b;--green:#176e66;--pink:#e8b7ac;--paper:#faf8f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,sans-serif}header{background:#e4eeea;padding:44px max(5vw,20px) 30px;border-bottom:1px solid #c9d8d1}header small{letter-spacing:3px;text-transform:uppercase;font-size:12px}h1{font:clamp(48px,8vw,86px)/1.1 Georgia;margin:12px 0;color:var(--green)}h2{font:32px Georgia;margin-top:0}h3{font-size:21px}header p{max-width:650px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 0}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #acc4bb;border-radius:12px;background:white;color:var(--ink);padding:10px 17px}button:hover{background:#e4eeea}button.active,.primary{background:var(--green);color:white}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #cf795f;outline-offset:3px}main{max-width:1200px;margin:auto;padding:28px 24px 80px}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;padding:26px;border:1px solid #dce2dc;border-radius:18px;margin-bottom:18px}.kitty{border-top:5px solid #d58c79}.ross{border-top:5px solid var(--green)}.tag{display:inline-block;padding:4px 12px;background:#f5e4dd;border-radius:20px;font-size:14px}.muted{color:#526964}.q{padding:22px;background:white;border:1px solid #dce2dc;border-radius:14px;margin:14px 0}.q label{display:block;font-weight:600;margin-bottom:10px}select{width:100%;padding:12px;border:1px solid #a8bdb3;border-radius:8px;background:white;color:var(--ink)}.feedback{margin-top:10px;font-size:16px}.good{border-left:5px solid #25825c}.bad{border-left:5px solid #b75041}.result{font-weight:700;padding:12px 0;min-height:35px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.intro{max-width:780px}.reading-tools{display:flex;gap:10px;margin-bottom:20px}.reading-tools button{font-size:15px}.hidden{display:none!important}.note{ba </style><header><small>Reading studio · A2–B1</small><h1>Blind Date<span style="color:#c47968">.</span></h1><p>Two people. One evening. Two different stories.<br>Read, compare and discover what really happened.</p><div id="progress" aria-live="polite"></div></header><main><nav aria-label="Lesson sections" id="nav"></nav><div id="panels"></div><div class="footer">Your answers are saved in this browser. <button id="reset">Reset all progress</button></div></main><script>
const article=[["First impressions", "He had a kind face with a beard … of course! Every guy has a beard these days! He laughed out loud when he saw me on my bike.", "We both arrived on bikes. I liked that – I couldn’t help laughing. And I loved her big smile and crazy clothes. She was so ‘bubbly’."], ["What did you talk about?", "Music, travel, jobs. I love my job – I get to travel a lot, but only in the UK. I’d love to see more of the world. I love that Ross left a well-paid job in London to be a carpenter. Oh, and me being a ‘veggie’ – he was surprised that I still eat fish.", "Music, our jobs – why I left my city job as a journalist and moved here. Kitty wants to travel the world. I did that when I was 21. I’m happy now, living and working by the sea. She’s ‘veggie’ – bad news, but … she eats fish – surprising! We were in a great fish restaurant."], ["Any difficult moments?", "It was really hot in the restaurant, and I had a big woolly jumper on. I was worried that I looked red!", "I think I said something that embarrassed her – she went very red. I don’t know what it was."], ["Best thing about him / her?", "He was chatty and funny. He tried to teach me how to wink! We laughed so much people were looking at us! He enjoys life and his work to the full.", "Her laugh! We both laughed a lot. I loved hearing about her job. She doesn’t earn much, but money doesn’t matter to Kitty. I’m the same."], ["Would your friends like him / her?", "Oh yes! They would love him.", "Very much. My flatmate, Mark, would really love her."], ["Describe him / her in three words.", "Funny, kind, intelligent.", "Funny, interesting, very pretty – sorry, that’s four!"], ["Did you go on somewhere?", "Yes, we went for a walk by the sea … in the rain. I love rain – I ran into the sea and fell over. Ross rescued me.", "Well, we didn’t go far, just down to the beach. I rescued Kitty when a wave knocked her over."], ["Did you kiss?", "Well, he rescued me, didn’t he? So, what do you think?!", "Well, when I picked her up from the water, she said, ‘Are you going to kiss me?’ So I did."], ["Marks out of 10?", "The more we talked, the more I liked him. 8.", "She can’t wink, but I like her. 9."], ["Would you like to meet again?", "We are going to meet again. He’s going to make a wardrobe for my new flat.", "Definitely – but I’m not going to introduce her to Mark!"]];const quiz=[["Where did they meet?", ["At a festival", "At the Oyster Shack", "In London"], 1, "They met at the Oyster Shack in Bigbury-on-Sea, Devon."], ["How did they arrive?", ["By bike", "By car", "On foot"], 0, "Ross: \u201cWe both arrived on bikes.\u201d"], ["What does Kitty do?", ["She is a journalist", "She is a carpenter", "She is a festival organizer"], 2, "Kitty Ferry, 22, festival organizer."], ["What was Ross\u2019s previous job?", ["A journalist", "A teacher", "A waiter"], 0, "He left his city job as a journalist."], ["Where does Kitty travel for work?", ["All over the world", "Only in the UK", "Only in London"], 1, "Kitty says she travels a lot, but only in the UK."], ["Why did Kitty go red?", ["She was angry", "She was hot in her jumper", "She was sunburnt"], 1, "It was hot and she was wearing a big woolly jumper."], ["What did Ross teach Kitty?", ["How to swim", "How to cook", "How to wink"], 2, "He tried to teach her how to wink."], ["What knocked Kitty over?", ["A bicycle", "A wave", "A dog"], 1, "Ross says a wave knocked her over."], ["Who suggested a kiss?", ["Kitty", "Ross", "Mark"], 0, "Kitty asked, \u201cAre you going to kiss me?\u201d"], ["Why will they meet again?", ["To buy bikes", "To meet Mark", "Ross will make a wardrobe"], 2, "He is going to make a wardrobe for Kitty\u2019s new flat."]];const who=[["Travelled around the world at 21.", "Ross"], ["Wants to see more of the world.", "Kitty"], ["Arrived on a bike.", "Both"], ["Gave the date 8 out of 10.", "Kitty"], ["Has a flatmate called Mark.", "Ross"], ["Enjoyed laughing during the date.", "Both"], ["Wants to meet again.", "Both"], ["Wore a big woolly jumper.", "Kitty"]];const vocab=[["bubbly", "lively and cheerful"], ["chatty", "liking to talk a lot"], ["well-paid", "earning a good salary"], ["rescue", "save someone from danger"], ["flatmate", "someone you share a flat with"], ["wink", "close one eye briefly"], ["wardrobe", "a piece of furniture for clothes"], ["embarrassed", "feeling awkward or ashamed"]];const endings=[["Kitty was ___ in Ross\u2019s job.", ["interested", "interesting"], 0, "Kitty experiences the feeling \u2192 -ed."], ["Ross thought Kitty was ___.", ["interested", "interesting"], 1, "Kitty causes interest \u2192 -ing."], ["Ross was ___ that Kitty ate fish.", ["surprised", "surprising"], 0, "Ross experiences surprise \u2192 -ed."], ["The news about her diet was ___.", ["surprised", "surprising"], 1, "The news causes surprise \u2192 -ing."], ["Ross thought Kitty felt ___.", ["embarrassed", "embarrassing"], 0, "A person\u2019s feeling \u2192 -ed."], ["It was an ___ moment.", ["embarrassed", "embarrassing"], 1, "The situation causes the feeling \u2192 -ing."]];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={answers:{},scores:{},notes:{}};try{state=JSON.parse(localStorage.getItem('blind-date-v1'))||state}catch(e){}function save(){try{localStorage.setItem('blind-date-v1',JSON.stringify(state))}catch(e){}updateProgress()}function updateProgress(){let n=Object.values(state.scores).reduce((a,b)=>a+b,0);$('#progress').textContent=`Practice score: ${n} / 38 · ${Object.keys(state.scores).length} / 5 activities checked`}
const tabs=['Read','Understand','Who?','Words','-ed / -ing','Timeline','Discuss'];$('#nav').innerHTML=tabs.map((x,i)=>`<button data-tab="${i}" class="${i===0?'active':''}">${i+1}. ${x}</button>`).join('');$('#panels').innerHTML=tabs.map((x,i)=>`<section class="panel ${i===0?'active':''}" id="p${i}" aria-label="${x}"></section>`).join('');$('#nav').onclick=e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.panel,nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');$('#p'+e.target.dataset.tab).classList.add('active');save()};
$('#p0').innerHTML=`<div class="intro"><h2>Will they ever meet again?</h2><p>Each week we organize a blind date between two of our readers. Then they answer questions about how it went.</p><p><b>Kitty Ferry, 22, festival organizer</b> meets <b>Ross Mayo, 31, carpenter.</b> They met in the <b>Oyster Shack</b> restaurant in Bigbury-on-Sea, Devon.</p></div><div class="reading-tools"><button data-read="both">Both stories</button><button data-read="kitty">Kitty only</button><button data-read="ross">Ross only</button></div><div class="grid" id="stories">${[1,2].map((col)=>`<article class="card ${col===1?'kitty':'ross'}"><span class="tag">${col===1?'Kitty → Ross':'Ross → Kitty'}</span><h2>${col===1?'Kitty talking about Ross':'Ross talking about Kitty'}</h2>${article.map(r=>`<h3>${esc(r[0].replace('him / her',col===1?'him':'her'))}</h3><p>${esc(r[col])}</p>`).join('')}</article>`).join('')}</div>`;
document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let v=b.dataset.read;document.querySelectorAll('#stories article').forEach(a=>a.classList.toggle('hidden',v!=='both'&&!a.classList.contains(v)));$('#stories').style.gridTemplateColumns=v==='both'?'':'1fr'});
const datasets={understand:quiz,who:who.map(r=>[r[0],['Kitty','Ross','Both'],['Kitty','Ross','Both'].indexOf(r[1]),r[1]+'. Check the two interviews for evidence.']),words:vocab.map((r)=>[r[0],[...vocab.map(x=>x[1])].sort(),[...vocab.map(x=>x[1])].sort().indexOf(r[1]),r[0]+' = '+r[1]]),endings};
function renderExercise(panel,id,title,instruction){const data=datasets[id];$('#p'+panel).innerHTML=`<h2>${title}</h2><p>${instruction}</p>${id==='endings'?'<details class="note"><summary>Need a grammar hint?</summary><b>-ed</b> describes how someone feels: I am bored.<br><b>-ing</b> describes what causes the feeling: The film is boring.</details>':''}<div>${data.map((r,i)=>`<div class="q" id="${id}-q${i}"><label for="${id}-${i}">${i+1}. ${esc(r[0])}</label><select id="${id}-${i}" data-ex="${id}" data-i="${i}"><option value="">Choose an answer…</option>${r[1].map((v,j)=>`<option value="${j}">${esc(v)}</option>`).join('')}</select><div class="feedback" aria-live="polite"></div></div>`).join('')}</div><div class="actions"><button class="primary" data-check="${id}">Check answers</button><button data-retry="${id}">Try again</button></div><div class="result" id="${id}-result" aria-live="polite"></div>`;data.forEach((r,i)=>{let el=$('#'+id+'-'+i);el.value=state.answers[id+'-'+i]??'';el.onchange=()=>{state.answers[el.id]=el.value;delete state.scores[id];$('#'+id+'-q'+i).className='q';$('#'+id+'-q'+i+' .feedback').textContent='';$('#'+id+'-result').textContent='Answers changed — check again.';save()}})}
renderExercise(1,'understand','Read between the lines','Choose the correct answer. You can return to the text at any time.');renderExercise(2,'who','Kitty, Ross or both?','Decide who each statement describes.');renderExercise(3,'words','Words from the date','Match each word to its meaning.');renderExercise(4,'endings','Feelings & impressions','Choose the correct adjective to complete each sentence.');
function check(id){let score=0;datasets[id].forEach((r,i)=>{let el=$('#'+id+'-'+i),box=$('#'+id+'-q'+i),ok=el.value!==''&&+el.value===r[2];score+=ok;box.className='q '+(ok?'good':'bad');box.querySelector('.feedback').textContent=ok?'✓ Correct. '+r[3]:el.value===''?'○ Choose an answer, then check again.':'↻ Not quite. '+r[3]});state.scores[id]=score;$('#'+id+'-result').textContent=`${score} / ${datasets[id].length} correct`;save()}
document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>check(b.dataset.check));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{let id=b.dataset.retry;datasets[id].forEach((r,i)=>{let el=$('#'+id+'-'+i);el.value='';delete state.answers[el.id];$('#'+id+'-q'+i).className='q';$('#'+id+'-q'+i+' .feedback').textContent=''});delete state.scores[id];$('#'+id+'-result').textContent='';save()});
const events=['They arrived at the restaurant on their bikes.','They talked about music, travel and their jobs.','They went for a walk by the sea.','A wave knocked Kitty over.','Ross rescued Kitty from the water.','Kitty asked Ross to kiss her, and he did.'];let order=state.order||[3,0,5,1,4,2];$('#p5').innerHTML='<h2>One evening, six moments</h2><p>Use the arrows to put the events in order, from first to last.</p><div id="timeline"></div><div class="actions"><button class="primary" id="check-order">Check order</button><button id="retry-order">Shuffle again</button></div><div class="result" id="order-result" aria-live="polite"></div>';function draw(){ $('#timeline').innerHTML=order.map((v,i)=>`<div class="seq-row"><b class="num">${i+1}</b><span>${esc(events[v])}</span><button data-up="${i}" aria-label="Move event ${i+1} up" ${i===0?'disabled':''}>↑</button><button data-down="${i}" aria-label="Move event ${i+1} down" ${i===5?'disabled':''}>↓</button></div>`).join('') }draw();$('#timeline').onclick=e=>{let up=e.target.dataset.up,down=e.target.dataset.down;if(up===undefined&&down===undefined)return;let i=+(up??down),j=i+(up!==undefined?-1:1);[order[i],order[j]]=[order[j],order[i]];state.order=order;delete state.scores.order;$('#order-result').textContent='';draw();save()};$('#check-order').onclick=()=>{let n=order.filter((v,i)=>v===i).length;state.scores.order=n;document.querySelectorAll('.seq-row').forEach((r,i)=>r.classList.add(order[i]===i?'good':'bad'));$('#order-result').textContent=n===6?'6 / 6 — The story is in the right order!':`${n} / 6 in the right position. Move the marked events and try again.`;save()};$('#retry-order').onclick=()=>{order=[2,5,1,4,0,3];state.order=order;delete state.scores.order;draw();$('#order-result').textContent='';save()};
const prompts=['What do Kitty and Ross have in common? Give three examples.','Why did Kitty go red? How did Ross explain it?','How are their travel experiences different?','Why do you think Ross doesn’t want Kitty to meet Mark?','Do you think they are a good match? Use details from the text.','What do you think will happen on their next date?'];$('#p6').innerHTML='<h2>Let’s talk</h2><p>Compare the stories and explain your opinion. These open answers are for discussion; they are not automatically marked.</p><div class="note">Useful language: <b>They both… · Unlike Kitty, Ross… · I think… because… · In my opinion…</b></div>'+prompts.map((q,i)=>`<div class="q"><label for="note${i}">${i+1}. ${esc(q)}</label><textarea id="note${i}" placeholder="Write your ideas here…"></textarea></div>`).join('');prompts.forEach((q,i)=>{let el=$('#note'+i);el.value=state.notes[i]||'';el.oninput=()=>{state.notes[i]=el.value;save()}});$('#reset').onclick=()=>{if(confirm('Clear all answers, scores and discussion notes?')){try{localStorage.removeItem('blind-date-v1')}catch(e){}location.reload()}};updateProgress();
</script></html>
