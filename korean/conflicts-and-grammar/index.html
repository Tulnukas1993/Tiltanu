<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 · интерактивный тренажёр</title><style>
:root{font-family:system-ui,"Noto Sans KR","Malgun Gothic",sans-serif;color:#18283b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#244e8c,#6d6bc4);color:white;padding:36px max(24px,calc((100% - 1050px)/2))}h1{font-size:clamp(24px,3.5vw,39px);margin:0 0 8px}header p{opacity:.92;max-width:780px;line-height:1.6}main{max-width:1050px;margin:auto;padding:25px 18px 70px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button{border:0;border-radius:12px;padding:12px 17px;cursor:pointer;font-weight:700;font-size:15px}nav button{background:white;color:#34517d;border:1px solid #d4e0ed}nav button.active{background:#264f89;color:white}.section{display:none}.section.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}.section-head h2{margin:0}.question{background:white;border:1px solid #dce5ef;border-radius:18px;margin:14px 0;padding:21px 23px;box-shadow:0 3px 12px #2d44610c}.question.correct{border-color:#2f9c7b}.question.incorrect{border-color:#d99257}.num{color:#6c7f98;font-size:14px;font-weight:700}.korean{font-size:20px;line-height:1.85;white-space:pre-line;margin:10px 0 15px;word-break:keep-all}.answer{width:100%;padding:12px 14px;border:1.5px solid #b9c9da;border-radius:10px;font-size:19px;font-family:inherit;min-height:49px;color:#173455;background:#fbfdff}input:focus{outline:2px solid #84a6ec}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#2759a5;color:#fff}.secondary{background:#edf3fa;color:#294b77}.explanation{padding:13px;border-radius:10px;background:#f2f6fc;margin-top:12px;line-height:1.65;display:none}.explanation.show{display:block}.feedback{font-weight:700;margin-top:10px}.ok{color:#177859}.bad{color:#ae632b}.footer-bar{position:sticky;bottom:0;background:#ffffffed;backdrop-filter:blur(12px);padding:12px;box-shadow:0 -3px 16px #24395517;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-radius:14px}.hint{color:#61738d;font-size:14px}.mini{font-size:14px;color:#60728a}#teacher{display:none;background:#fff7e7;padding:20px;border-radius:16px;margin-bottom:22px}#teacher.open{display:block}#teacher summary{cursor:pointer}#teacher li{padding:4px 0;line-height:1.6}@media(max-width:600px){header{padding:26px 18px}.korean{font-size:18px}.question{padding:16px}button{padding:10px 12px}} </style></head><body><header><h1>한국어 연습 · Практика корейского</h1><p>6 тематических блоков · 42 задания из учебника + 10 новых ситуаций · проверка ответов и объяснения. Вводите полные корейские выражения, а там, где два пропуска, разделяйте ответы знаком <b>|</b>.</p></header><main><nav id="tabs"></nav><details id="teacher"><summary><b>Ключи преподавателя — все ответы и обоснования</b></summary><div id="teacher-content"></div></details><button class="secondary" onclick="document.getElementById('teacher').classList.toggle('open')">🔑 Показать / скрыть ключи преподавателя</button><div id="sections"></div><div class="footer-bar"><span id="score">Проверено: 0 / 42</span><div><button class="secondary" onclick="resetAll()">Очистить ответы</button> <button class="primary" onclick="checkSection()">Проверить весь раздел</button></div></div></main><script>
const DATA=[{"title": "1. 어휘 · 문장 완성", "intro": "Подберите глагол и поставьте в нужную форму.", "items": [{"q": "요즘 너무 바빠서 자주 _____.", "a": "실수합니다", "alt": ["실수해요", "실수한다"], "why": "실수하다 — ошибаться. 자주 + настоящее время."}, {"q": "오늘 아침에 우산을 _____. 지하철에 우산을 놓고 내린 것 같습니다.", "a": "잃어버렸습니다", "alt": ["잃어버렸어요"], "why": "잃어버리다 — потерять; событие произошло сегодня утром."}, {"q": "약속이 토요일이었는데 일요일로 _____.", "a": "착각했습니다", "alt": ["착각했어요"], "why": "착각하다 — перепутать / ошибочно полагать; прошедшее время."}, {"q": "저는 동생과 아주 친해서 잘 _____ 않습니다.", "a": "싸우지", "alt": [], "why": "싸우다 + -지 않다 — не ссориться."}, {"q": "여자 친구 생일을 _____. 그래서 여자 친구가 저한테 _____.", "a": "잊어버렸습니다|화를 냈습니다", "alt": ["잊어버렸어요|화를 냈어요"], "why": "잊어버리다 — забыть; 화를 내다 — рассердиться (на кого-то: 저한테)."}, {"q": "친한 친구를 _____ 며칠 동안 말을 하지 않았습니다.", "a": "오해해서", "alt": ["오해해"], "why": "오해하다 — неправильно понять; -아서/어서 передаёт причину. Возможна также форма 오해하고 по контексту."}]}, {"title": "2. 어휘 · 대화 완성", "intro": "Завершите диалоги подходящим выражением.", "items": [{"q": "A: 유나 씨, 왜 지원 씨하고 인사를 안 해요?\nB: 그저께 지원 씨하고 싸웠어요.\nA: 왜요? 두 사람이 친하지 않았어요? 빨리 _____(으)세요.", "a": "화해하", "alt": ["화해하세요"], "why": "화해하다 + -(으)세요 → 화해하세요. В исходном шаблоне окончание уже дано."}, {"q": "A: 미안해요. 길이 많이 막혀서 늦었어요.\nB: 왜 항상 길이 막혀요? 그런 _____지 마세요.", "a": "변명하", "alt": ["변명하지"], "why": "변명하다 — оправдываться; 변명하지 마세요 — не оправдывайтесь."}, {"q": "A: 나기마 씨, 어제는 미안했어요. 어제 일은 제가 잘못한 것 같아요.\nB: 아니에요, 준영 씨. 제가 잘못한 것도 있어요. 저도 준영 씨한테 _____ 싶어요.", "a": "사과하고", "alt": ["사과하"], "why": "사과하다 + -고 싶다 → 사과하고 싶어요."}, {"q": "A: 왜 오늘은 학교에 안 갔어?\nB: 엄마, 잘못했어요. _____아/어 주세요.", "a": "용서하", "alt": [], "why": "용서하다 → 용서해 주세요. В оригинале окончание -아/어 주세요 уже напечатано."}, {"q": "A: 한국하고 카자흐스탄은 문화가 많이 다른 것 같아요.\nB: 네, 그래서 다른 문화에서 온 사람들은 서로 오해하기가 쉬운 것 같아요.\n다른 문화에서 온 사람을 _____ 것은 쉽지 않아요.", "a": "이해하는", "alt": ["이해하"], "why": "이해하다 + -는 것 → 이해하는 것 (понимать других людей)."}, {"q": "A: 민준 씨, 어디 아파요?\nB: 아니에요. 안 좋은 일이 좀 있어서 그래요. 제가 여자 친구한테 잘못을 했어요.\nA: 그래요? 무슨 잘못을 했어요? 여자 친구한테 _____(으)세요.", "a": "용서를 비", "alt": ["용서를 빌"], "why": "용서를 빌다 + -(으)세요 → 용서를 비세요. В пустое место до -(으)세요 пишем 용서를 비."}]}, {"title": "3. 문장 연결 · -(으)려고", "intro": "Соедините действия по образцу: 살을 빼다 / 운동을 하다 → 살을 빼려고 운동을 합니다.", "items": [{"q": "여행을 가다 / 여권을 만들다", "a": "여행을 가려고 여권을 만듭니다", "alt": ["여행을 가려고 여권을 만들어요"], "why": "-(으)려고: цель. 여행을 가려고 — чтобы поехать путешествовать."}, {"q": "차를 사다 / 저금을 하다", "a": "차를 사려고 저금을 합니다", "alt": ["차를 사려고 저금을 해요"], "why": "차를 사려고 — чтобы купить машину."}, {"q": "수영을 하다 / 수영장에 가다", "a": "수영을 하려고 수영장에 갑니다", "alt": ["수영을 하려고 수영장에 가요"], "why": "Чтобы поплавать, иду в бассейн."}, {"q": "편지를 보내다 / 우체국에 가다", "a": "편지를 보내려고 우체국에 갑니다", "alt": ["편지를 보내려고 우체국에 가요"], "why": "Чтобы отправить письмо, иду на почту."}]}, {"title": "4. 목적 · -(으)려고", "intro": "Дополните ответ: «Я пришёл/позвонил/купил/пошёл, чтобы…».", "items": [{"q": "A: 무엇을 도와드릴까요?\nB: _____ 왔어요. (기차표를 사다)", "a": "기차표를 사려고", "alt": [], "why": "사다 → 사려고."}, {"q": "A: 민준 씨, 무슨 일로 전화했어요?\nB: _____ 전화했어요. (유나 씨한테 책을 빌리다)", "a": "유나 씨한테 책을 빌리려고", "alt": [], "why": "빌리다 → 빌리려고."}, {"q": "A: 무엇을 도와드릴까요?\nB: _____ 왔어요. (예약하다)", "a": "예약하려고", "alt": [], "why": "예약하다 → 예약하려고."}, {"q": "A: 어디에 가세요?\nB: _____ 백화점에 가요. (친구 생일 선물을 사다)", "a": "친구 생일 선물을 사려고", "alt": [], "why": "사다 → 사려고."}, {"q": "A: 무엇을 샀어요?\nB: _____ 소고기를 샀어요. (불고기를 만들다)", "a": "불고기를 만들려고", "alt": [], "why": "받침 ㄹ + -려고: 만들려고."}, {"q": "A: 우체국에 왜 가세요?\nB: _____ 우체국에 가요. (고향 친구에게 편지를 보내다)", "a": "고향 친구에게 편지를 보내려고", "alt": [], "why": "보내다 → 보내려고."}, {"q": "A: 도서관에 왜 왔어요?\nB: _____ 도서관에 왔어요. (시험 공부를 하다)", "a": "시험 공부를 하려고", "alt": [], "why": "하다 → 하려고."}, {"q": "A: 오늘은 왜 일찍 일어났어요?\nB: _____ 일찍 일어났어요. (회사에 일찍 가다)", "a": "회사에 일찍 가려고", "alt": [], "why": "가다 → 가려고."}, {"q": "A: 왜 한국어를 공부해요?\nB: _____ 한국어를 공부해요. (한국 회사에 취직하다)", "a": "한국 회사에 취직하려고", "alt": [], "why": "취직하다 → 취직하려고."}]}, {"title": "5. 경험 · -(으)ㄴ 적이 있다/없다", "intro": "В каждом пункте два ответа: «да» и «нет». Разделяйте их знаком |.", "items": [{"q": "A: 다른 나라에 가 본 적이 있어요?\nB: 네, _____. (일본)\n아니요, _____.", "a": "일본에 가 본 적이 있어요|가 본 적이 없어요", "alt": [], "why": "가다 → 가 본 적이 있다 / 없다: был или не был в другой стране."}, {"q": "A: 외국어를 배운 적이 있어요?\nB: 네, _____. (영어)\n아니요, _____.", "a": "영어를 배운 적이 있어요|배운 적이 없어요", "alt": [], "why": "배우다 → 배운 적이 있어요."}, {"q": "A: 요리를 해 본 적이 있어요?\nB: 네, _____. (샤슬릭)\n아니요, _____.", "a": "샤슬릭을 해 본 적이 있어요|해 본 적이 없어요", "alt": ["샤슬릭을 만들어 본 적이 있어요|해 본 적이 없어요"], "why": "하다 → 해 본 적이 있다 / 없다."}]}, {"title": "6. 의지 · -(으)ㄹ게요", "intro": "Ответьте от лица B, выразив готовность выполнить действие.", "items": [{"q": "A: 호텔을 알아봐야 돼요.\nB: _____.", "a": "제가 알아볼게요", "alt": [], "why": "알아보다 → 알아볼게요: я узнаю / поищу."}, {"q": "A: 쓰레기를 버려야 돼요.\nB: _____.", "a": "제가 버릴게요", "alt": [], "why": "버리다 → 버릴게요."}, {"q": "A: 영화표를 예매해야 돼요.\nB: _____.", "a": "제가 예매할게요", "alt": [], "why": "예매하다 → 예매할게요."}, {"q": "A: 선생님께 연락드려야 돼요.\nB: _____.", "a": "제가 연락드릴게요", "alt": [], "why": "연락드리다 → 연락드릴게요; уважительный глагол 드리다."}]}, {"title": "7. 새로운 상황 · смешанная практика", "intro": "Новые ситуации: используйте лексику и конструкции из предыдущих шести блоков.", "items": [{"q": "친구와 싸웠어요. 내일 친구에게 _____ 싶어요. (사과하다)", "a": "사과하고", "alt": [], "why": "-고 싶다 выражает желание: 사과하고 싶어요."}, {"q": "기차표를 _____ 역에 갔어요. (사다)", "a": "사려고", "alt": [], "why": "Цель: 사다 → 사려고."}, {"q": "A: 한국 음식을 먹어 본 적이 있어요?\nB: 네, 김치를 _____.", "a": "먹어 본 적이 있어요", "alt": [], "why": "Опыт: -어 본 적이 있어요."}, {"q": "A: 쓰레기를 버려야 돼요.\nB: 제가 _____.", "a": "버릴게요", "alt": [], "why": "Готовность: 버리다 → 버릴게요."}, {"q": "오늘은 바빠서 친구 생일을 _____. (잊어버리다)", "a": "잊어버렸어요", "alt": ["잊어버렸습니다"], "why": "Прошедшее время 잊어버리다 → 잊어버렸어요."}, {"q": "친구를 _____ 말을 안 했어요. (오해하다)", "a": "오해해서", "alt": [], "why": "Причина: 오해하다 → 오해해서."}, {"q": "A: 왜 우체국에 가요?\nB: 편지를 _____ 가요. (보내다)", "a": "보내려고", "alt": [], "why": "보내다 + -(으)려고 = 보내려고."}, {"q": "A: 일본에 가 본 적이 있어요?\nB: 아니요, 일본에 _____.", "a": "가 본 적이 없어요", "alt": [], "why": "Отсутствие опыта: -ㄴ 적이 없어요."}, {"q": "A: 표를 예매해야 돼요.\nB: 제가 _____.", "a": "예매할게요", "alt": [], "why": "Обещание или добровольное решение: 예매할게요."}, {"q": "그런 _____ 마세요. (변명하다)", "a": "변명하지", "alt": [], "why": "Запрет: -지 마세요."}]}]; let selected=0; const total=DATA.reduce((n,s)=>n+s.items.length,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.replace(/[\s.,!?！？。，]/g,'').trim().replace(/[|｜]/g,'|');
const tabs=document.querySelector('#tabs'),wrap=document.querySelector('#sections');
DATA.forEach((s,si)=>{let tab=document.createElement('button');tab.textContent=`${si+1} · ${['Лексика','Диалоги','Цель','Намерение','Опыт','Обещание','Новые ситуации'][si]}`;tab.onclick=()=>select(si);tabs.append(tab);let block=document.createElement('section');block.className='section';block.id='section'+si;block.innerHTML=`<div class="section-head"><div><h2>${esc(s.title)}</h2><p class="hint">${esc(s.intro)}</p></div><span class="mini">${s.items.length} заданий</span></div>`;s.items.forEach((item,i)=>{const q=document.createElement('article');q.className='question';q.id=`q-${si}-${i}`;q.innerHTML=`<div class="num">Задание ${i+1}</div><div class="korean">${esc(item.q)}</div><input class="answer" spellcheck="false" lang="ko" id="a-${si}-${i}" autocomplete="off" placeholder="Ваш ответ по-корейски"><div class="actions"><button class="primary" onclick="check(${si},${i})">Проверить</button><button class="secondary" onclick="reveal(${si},${i})">Ответ и объяснение</button></div><div class="feedback" id="f-${si}-${i}"></div><div class="explanation" id="e-${si}-${i}"><b>Ответ:</b> ${esc(item.a.replaceAll('|',' / '))}<p>${esc(item.why)}</p></div>`;block.append(q)});wrap.append(block)});
function select(n){selected=n;[...tabs.children].forEach((e,i)=>e.classList.toggle('active',i===n));document.querySelectorAll('.section').forEach((e,i)=>e.classList.toggle('active',i===n));window.scrollTo({top:0,behavior:'smooth'})}
function check(s,i){let d=DATA[s].items[i],v=norm(document.getElementById(`a-${s}-${i}`).value),card=document.getElementById(`q-${s}-${i}`),f=document.getElementById(`f-${s}-${i}`);card.classList.remove('correct','incorrect');if(!v){f.textContent='Введите ответ.';f.className='feedback bad';return}let ok=[d.a,...d.alt].some(x=>norm(x)===v);card.classList.add(ok?'correct':'incorrect');f.textContent=ok?'✓ Верно!':'Пока не совпадает с ключом. Проверьте форму и частицы (возможны и другие правильные варианты).';f.className='feedback '+(ok?'ok':'bad');card.dataset.checked='1';score()}
function reveal(s,i){document.getElementById(`e-${s}-${i}`).classList.toggle('show')}
function score(){let cards=[...document.querySelectorAll('.question')];document.getElementById('score').textContent=`Проверено: ${cards.filter(x=>x.dataset.checked).length} / ${total} · верно: ${cards.filter(x=>x.classList.contains('correct')).length}`}
function checkSection(){DATA[selected].items.forEach((_,i)=>check(selected,i))}
function resetAll(){document.querySelectorAll('.answer').forEach(x=>x.value='');document.querySelectorAll('.question').forEach(x=>{x.classList.remove('correct','incorrect');delete x.dataset.checked});document.querySelectorAll('.feedback').forEach(x=>x.textContent='');document.querySelectorAll('.explanation').forEach(x=>x.classList.remove('show'));score()}
document.getElementById('teacher-content').innerHTML=DATA.map((s,si)=>`<h3>${esc(s.title)}</h3><ol>${s.items.map(x=>`<li><b>${esc(x.a.replaceAll('|',' / '))}</b> — ${esc(x.why)}</li>`).join('')}</ol>`).join('');select(0);score();</script></body></html>
