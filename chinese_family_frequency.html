</style></head><body><div class="shell"><header><span class="brand">汉语练习 / ПРАКТИКУМ 01</span><div class="tools"><button id="py" aria-pressed="true">Пиньинь: вкл.</button><a href="./chinese_family_frequency.html" download="chinese_family_frequency.html">Скачать HTML</a><button id="reset">Начать заново</button></div></header><div id="resetBox" hidden class="reset-box">Удалить ответы и результаты этого практикума? <button id="yesReset">Удалить</button> <button id="noReset">Отмена</button></div><h1>家人和工作</h1><p class="lead">Семья, профессии и привычки. Семь упражнений по первой части урока — до слов частотности включительно.</p><div class="overview"><span class="pill">34 задания с проверкой</span><span class="pill">Пиньинь над новой лексикой</span><span class="pill" id="score">Верно: 0 / 34</span></div><progress id="progress" max="34" value="0" aria-label="Правильные ответы"></progress><nav id="nav" aria-label="Разделы"></nav><main id="main"></main><div class="footnav"><button id="prev">← Назад</button><span id="pageInfo" class="status"></span><button id="next" class="primary">Дальше →</button></div><p class="saved" id="saved">Ответы сохраняются в этом браузере.</p></div><script>
const vocabulary=[
['摄影师','shèyǐngshī','фотограф'],['教授','jiàoshòu','профессор'],['作家','zuòjiā','писатель'],['工程师','gōngchéngshī','инженер'],['医生','yīshēng','врач'],['律师','lǜshī','юрист'],['秘书','mìshū','секретарь'],['服务员','fúwùyuán','официант'],['家庭主妇','jiātíng zhǔfù','домохозяйка'],['总是','zǒngshì','всегда'],['经常','jīngcháng','часто'],['常常','chángcháng','часто'],['有时候','yǒu shíhou','иногда'],['从来不','cónglái bù','никогда не'],['一般','yìbān','обычно, как правило'],['小时候','xiǎoshíhou','в детстве'],['从小就','cóng xiǎo jiù','с самого детства'],['叔叔','shūshu','дядя (младший брат отца)'],['婶婶','shěnshen','жена младшего брата отца'],['舅舅','jiùjiu','брат матери'],['姑姑','gūgu','сестра отца'],['阿姨','āyí','тётя'],['外婆','wàipó','бабушка по матери'],['医院','yīyuàn','больница'],['饭店','fàndiàn','ресторан'],['客人','kèrén','гость, клиент'],['上菜','shàng cài','подавать блюда'],['教书','jiāo shū','преподавать'],['拍照片','pāi zhàopiàn','фотографировать'],['设计','shèjì','проектировать'],['机器','jīqì','машина, механизм'],['小说','xiǎoshuō','роман'],['帮助','bāngzhù','помогать'],['经理','jīnglǐ','менеджер'],['安排','ānpái','организовывать'],['解决','jiějué','решать'],['法律','fǎlǜ','закон, право'],['问题','wèntí','вопрос, проблема'],['最近','zuìjìn','недавно, в последнее время'],['结婚','jié hūn','вступать в брак'],['孩子','háizi','ребёнок'],['自己','zìjǐ','сам, свой'],['例外','lìwài','исключение'],['通常','tōngcháng','обычно'],['大部分','dà bùfen','большая часть'],['办公室','bàngōngshì','офис'],['偶尔','ǒu’ěr','изредка'],['好几次','hǎo jǐ cì','несколько раз'],['图书馆','túshūguǎn','библиотека'],['摄影','shèyǐng','фотография'],['周末','zhōumò','выходные'],['开始','kāishǐ','начинать'],['见面','jiàn miàn','встречаться'],['逛街','guàng jiē','гулять по магазинам'],['咖啡','kāfēi','кофе']];
const dict=Object.fromEntries(vocabulary.map(v=>[v[0],v[1]])), keys=Object.keys(dict).sort((a,b)=>b.length-a.length);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ruby(s){let out='',i=0;while(i<s.length){const k=keys.find(k=>s.startsWith(k,i));if(k){out+='<ruby>'+k+'<rt>'+dict[k]+'</rt></ruby>';i+=k.length;}else out+=esc(s[i++]);}return out;}
const norm=s=>s.normalize('NFKC').replace(/[\s，。？！、,.!?：:；;]/g,'');
const jobQ=[['我叔叔在医院工作。他是____。','医生'],['我姐姐在饭店工作，给客人上菜。她是____。','服务员'],['我爷爷在大学教书。他是____。','教授'],['我哥哥给别人拍照片。他是____。','摄影师'],['我奶奶设计机器。她是____。','工程师'],['我姑姑写小说。她是____。','作家'],['我阿姨帮助经理安排工作。她是____。','秘书'],['我舅舅帮助别人解决法律问题。他是____。','律师']];
const dialogue=[['我奶奶是工程师。',['你奶奶做什么工作','你奶奶是做什么工作的'],'你奶奶做什么工作？'],['他在大学工作。',['他在哪儿工作','他在哪里工作'],'他在哪儿工作？'],['她不工作，是家庭主妇。',['她做什么工作','她是做什么工作的'],'她做什么工作？'],['还没有。他们最近刚结婚。',['他们有孩子吗','他们有没有孩子'],'他们有孩子吗？'],['我爷爷也是作家。',['你爷爷也是作家吗','你爷爷呢'],'你爷爷也是作家吗？'],['她很喜欢自己的工作。',['她喜欢自己的工作吗','她喜不喜欢自己的工作'],'她喜欢自己的工作吗？']];
const freq=[['我妈妈每天都喝茶，一天也不例外。她____喝茶。',['总是','有时候'],'总是','每天都如此，强调一直这样。每天如此，没有例外。'],['我哥哥一个星期有四五天在家吃晚饭。他____在家吃晚饭。',['经常','从来不'],'经常','Четыре-пять дней в неделю: часто.'],['我妹妹不喝咖啡，一次也不喝。她____喝咖啡。',['从来不','有时候'],'从来不','Ни разу: 从来不 + действие.'],['我爸爸通常八点上班，今天七点就上班了。他____八点上班。',['一般','从来不'],'一般','Обычный распорядок допускает исключения.'],['我叔叔大部分时间在办公室工作，但偶尔也在家工作。他____在家工作。',['总是','有时候'],'有时候','偶尔: изредка, иногда.'],['我小时候一个星期去奶奶家好几次。我小时候____去奶奶家。',['常常','从来不'],'常常','Несколько раз в неделю: часто.']];
const orders=[['我姐姐','经常','去','图书馆'],['我爸爸','一般','八点','上班'],['我奶奶','从来不','喝','咖啡'],['我叔叔','有时候','在家','工作'],['我爷爷','晚上','常常','写书'],['我妈妈','总是','很忙'],['我','小时候','常常','去','外婆家'],['我哥哥','从小就','喜欢','摄影']];
const fixes=[['我爸爸上班一般八点。',['我爸爸一般八点上班']],['我奶奶喝从来不咖啡。',['我奶奶从来不喝咖啡']],['我叔叔工作有时候在家。',['我叔叔有时候在家工作','有时候我叔叔在家工作']],['我姐姐很忙总是。',['我姐姐总是很忙']],['我小时候去常常爷爷家。',['我小时候常常去爷爷家','小时候我常常去爷爷家']],['我哥哥喜欢从小就拍照片。',['我哥哥从小就喜欢拍照片']]];
const personal=['我经常……','我一般……','我有时候……，但是……','我从来不……','我妈妈／爸爸总是……','我小时候常常……','我从小就……','我……经常……'];
const samples=['我经常跟朋友见面。','我一般八点开始工作。','我有时候在家工作，但是我一般在办公室工作。','我从来不喝咖啡。','我爸爸总是很忙。','我小时候常常去外婆家。','我从小就喜欢摄影。','我姐姐经常去图书馆。'];
const interview=['你做什么工作？你在哪儿工作？','你一般几点开始工作？','你经常在家工作吗？','你有时候周末工作吗？','你经常跟谁见面？','你小时候常常去爷爷奶奶家吗？','你家里谁总是很忙？','你家里谁从来不喝咖啡？'];
const titles=['Словарь','1. Профессии','2. Диалоги','3. Частотность','4. Собери фразу','5. Исправь','6. О себе','7. Интервью'];
const storeKey='family-frequency-v1';let state={page:0,py:true,answers:{},results:{},shown:{}};try{const v=JSON.parse(localStorage.getItem(storeKey));if(v&&v.answers)state={...state,...v};}catch{}let saveFailed=false;
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state));}catch{saveFailed=true;}updateScore();}
function updateScore(){const n=Object.values(state.results).filter(v=>v==='ok').length;document.getElementById('score').textContent=`Верно: ${n} / 34`;document.getElementById('progress').value=n;if(saveFailed)document.getElementById('saved').textContent='Браузер не разрешил сохранение. Ответы доступны до закрытия страницы.';}
const main=document.getElementById('main');
function card(id,i,prompt){let c=document.createElement('article');c.className='card';c.id=id;c.innerHTML=`<div class="num">ЗАДАНИЕ ${i+1}</div><div class="cn prompt">${ruby(prompt)}</div>`;main.append(c);return c;}
function feedback(c,id){let el=document.createElement('div');el.className='feedback';el.setAttribute('role','status');c.append(el);c._fb=el;const r=state.results[id];if(r==='ok')mark(c,id,true);else if(r==='wrong')mark(c,id,false);}
function mark(c,id,ok,message){c.classList.toggle('correct',ok);c.classList.toggle('wrong',!ok);c._fb.className='feedback '+(ok?'good':'bad');c._fb.textContent=message||(ok?'Верно!':'Пока не совпало. Попробуйте ещё раз.');state.results[id]=ok?'ok':'wrong';save();}
function dirty(c,id){delete state.results[id];c.classList.remove('correct','wrong');if(c._fb)c._fb.textContent='';save();}
function btn(label,fn,cls=''){let b=document.createElement('button');b.type='button';b.textContent=label;b.className=cls;b.onclick=fn;return b;}
function showExample(c,id,text){if(c.querySelector('.sample'))return;let el=document.createElement('div');el.className='sample';el.innerHTML='<span class="hint">Образец для самопроверки</span><div class="cn">'+ruby(text)+'</div>';c.append(el);state.shown[id]=true;save();}
function textTask(c,id,accepted,example,flexible=false){let inp=document.createElement('input');inp.type='text';inp.lang='zh';inp.setAttribute('aria-label','Ответ иероглифами');inp.placeholder='Напишите иероглифами…';inp.value=state.answers[id]||'';inp.oninput=()=>{state.answers[id]=inp.value;dirty(c,id)};c.append(inp);let bar=document.createElement('div');bar.className='row';bar.append(btn('Проверить',()=>{if(!inp.value.trim()){c._fb.textContent='Сначала напишите ответ.';return;}let ok=accepted.some(a=>norm(a)===norm(inp.value));mark(c,id,ok,!ok&&flexible?'Не совпало с образцами. Другой вопрос тоже может быть верным — обсудите его с преподавателем.':undefined);},'primary'),btn('Показать образец',()=>showExample(c,id,example)));c.append(bar);feedback(c,id);if(state.shown[id])showExample(c,id,example);}
function choice(c,id,options,correct,explain=''){let row=document.createElement('div');row.className='options';options.forEach(o=>{const b=btn('',()=>{state.answers[id]=o;dirty(c,id);for(const t of row.children){const sel=t.dataset.value===o;t.classList.toggle('selected',sel);t.setAttribute('aria-pressed',sel);} });b.innerHTML=ruby(o);b.dataset.value=o;b.classList.toggle('selected',state.answers[id]===o);b.setAttribute('aria-pressed',state.answers[id]===o);row.append(b);});c.append(row);c.append(btn('Проверить',()=>{if(!state.answers[id]){c._fb.textContent='Сначала выберите слово.';return;}const ok=state.answers[id]===correct;mark(c,id,ok,ok?('Верно! '+explain):undefined);},'primary'));feedback(c,id);}
function intro(title,desc){main.innerHTML=`<div class="intro"><h2>${esc(title)}</h2><p>${desc}</p></div>`;}
function render(){state.page=Math.max(0,Math.min(7,state.page));document.body.classList.toggle('no-pinyin',!state.py);document.getElementById('py').textContent='Пиньинь: '+(state.py?'вкл.':'выкл.');document.getElementById('py').setAttribute('aria-pressed',state.py);let nav=document.getElementById('nav');nav.innerHTML='';titles.forEach((t,i)=>{let b=btn(t,()=>go(i),state.page===i?'active':'');if(i===state.page)b.setAttribute('aria-current','page');nav.append(b);});
if(state.page===0){intro('Новые слова — с опорой на пиньинь','Пиньинь включён по умолчанию и появляется над этими словами во всех заданиях.');main.innerHTML+='<div class="note"><b>Слова частотности:</b> 总是 — всегда; 经常／常常 — часто; 有时候 — иногда; 从来不 — никогда не.<br><b>一般</b> означает «обычно, как правило». <b>小时候</b> — «в детстве», <b>从小就</b> — «с самого детства»: эти два выражения указывают на время, а не частотность.<br>Обычно слово частотности стоит перед действием: 我经常喝茶。</div><div class="wordgrid">'+vocabulary.map(([h,p,t])=>`<div class="word"><div class="cn">${ruby(h)}</div><small>${esc(t)}</small></div>`).join('')+'</div>';}
if(state.page===1){intro('谁做什么工作？','Впишите профессию иероглифами. Каждое слово используйте один раз.');main.innerHTML+='<div class="note cn">'+['摄影师','教授','作家','工程师','医生','律师','秘书','服务员'].map(ruby).join('　')+'</div>';jobQ.forEach(([q,a],i)=>textTask(card('j'+i,i,q),'j'+i,[a],a));}
if(state.page===2){intro('把对话补充完整','Напишите вопрос к ответу. Возможны разные формулировки: программа узнаёт основные варианты, остальные можно обсудить с преподавателем. Пример: 你叔叔做什么工作？— 他是摄影师。');dialogue.forEach(([q,a,ex],i)=>textTask(card('d'+i,i,'— ……？\n— '+q),'d'+i,a,ex,true));}
if(state.page===3){intro('选择合适的词','Выберите слово частотности по смыслу.');freq.forEach(([q,ops,a,ex],i)=>choice(card('f'+i,i,q),'f'+i,ops,a,i===0?'Каждый день, без исключений.':ex));}
if(state.page===4){intro('把词语排列成句子','Нажимайте на плитки по порядку. Нажатие на выбранную плитку возвращает её обратно. Начинайте с первого слова, указанного под заданием.');orders.forEach((words,i)=>{let id='o'+i,c=card(id,i,'Соберите предложение');c.querySelector('.prompt').classList.remove('cn');let hint=document.createElement('p');hint.className='hint';hint.innerHTML='Начните с: <span class="cn">'+ruby(words[0])+'</span>';c.append(hint);let ans=document.createElement('div'),bank=document.createElement('div');ans.className='answer';bank.className='bank';c.append(ans,bank);let seq=Array.isArray(state.answers[id])?state.answers[id]:[];const order=words.map((_,k)=>(k+2)%words.length).reverse();function draw(){ans.innerHTML='';bank.innerHTML='';if(!seq.length)ans.innerHTML='<span class="empty">Здесь появится ваше предложение</span>';seq.forEach((k,j)=>{let b=btn('',()=>{seq.splice(j,1);state.answers[id]=seq;dirty(c,id);draw()},'token');b.innerHTML=ruby(words[k]);b.setAttribute('aria-label','Убрать '+words[k]);ans.append(b)});order.forEach(k=>{let b=btn('',()=>{seq.push(k);state.answers[id]=seq;dirty(c,id);draw()},'token');b.innerHTML=ruby(words[k]);b.disabled=seq.includes(k);bank.append(b)});}
c.append(btn('Проверить',()=>{if(seq.length!==words.length){c._fb.textContent='Используйте все плитки.';return;}let v=seq.map(k=>words[k]).join('');let valid=[words.join('')];if(i===4)valid.push('我爷爷常常晚上写书');mark(c,id,valid.includes(v));},'primary'),btn('Собрать заново',()=>{seq=[];state.answers[id]=seq;dirty(c,id);draw()}));feedback(c,id);draw();});}
if(state.page===5){intro('改正错误','Исправьте порядок слов и напишите предложение целиком. Пунктуация и пробелы на результат не влияют.');fixes.forEach(([q,a],i)=>textTask(card('e'+i,i,q),'e'+i,a,a[0]+'。'));}
if(state.page===6){intro('说说你自己和家人','Закончите предложения правдиво. Эти ответы открытые: они сохраняются, но не оцениваются автоматически.');personal.forEach((q,i)=>openTask('p'+i,i,q,samples[i]));}
if(state.page===7){intro('采访你的同学','Задайте вопросы партнёру и запишите ответы. Затем составьте рассказ. Здесь нет единственного правильного ответа.');interview.forEach((q,i)=>openTask('i'+i,i,q));openTask('story',8,'他／她是……，在……工作。\n他／她一般……，经常……，有时候……。\n他／她的……是……。\n他／她的……总是……，从来不……。');}
document.getElementById('prev').disabled=state.page===0;document.getElementById('next').disabled=state.page===7;document.getElementById('pageInfo').textContent=`${state.page+1} / 8`;updateScore();}
function openTask(id,i,q,ex){let c=card(id,i,q);let t=document.createElement('textarea');t.lang='zh';t.setAttribute('aria-label','Ваш свободный ответ');t.placeholder='Ваш ответ…';t.value=state.answers[id]||'';t.oninput=()=>{state.answers[id]=t.value;save()};c.append(t);if(ex){c.append(btn('Показать пример',()=>showExample(c,id,ex)));if(state.shown[id])showExample(c,id,ex);}}
function go(i){state.page=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}document.getElementById('py').onclick=()=>{state.py=!state.py;save();render()};document.getElementById('prev').onclick=()=>go(state.page-1);document.getElementById('next').onclick=()=>go(state.page+1);document.getElementById('reset').onclick=()=>{document.getElementById('resetBox').hidden=false};document.getElementById('noReset').onclick=()=>document.getElementById('resetBox').hidden=true;document.getElementById('yesReset').onclick=()=>{state={page:0,py:state.py,answers:{},results:{},shown:{}};save();document.getElementById('resetBox').hidden=true;render()};render();
</script></body></html>
